name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[yaml]"
      - run: python -m compileall -q runtime protocol adapters tests
      - name: Validate Adapter manifests and protocol examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from runtime.localize_anything.contracts import validate_adapter_tree
          from runtime.localize_anything.schema_validation import validate_protocol_tree

          adapters = validate_adapter_tree(Path("adapters"))
          protocol = validate_protocol_tree(Path("protocol"))
          print(json.dumps({"adapters": adapters, "protocol": protocol}, indent=2))
          if adapters["status"] != "pass" or adapters["manifests_checked"] != 13:
              raise SystemExit("Adapter manifest validation failed")
          if (
              protocol["status"] != "pass"
              or protocol["schemas_checked"] != 7
              or protocol["examples_checked"] != 7
          ):
              raise SystemExit("Protocol schema/example validation failed")
          PY
      - run: python -m unittest discover -s tests -p "test*.py" -v
