[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localize-anything"
version = "0.5.0"
readme = "README.en.md"
description = "Localization workflow and review layer for Coding Agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0,<7"]

[project.scripts]
localize = "runtime.localize_anything.core_cli:main"

[tool.setuptools.packages.find]
include = ["runtime*"]
